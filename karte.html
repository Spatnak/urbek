<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>URBEX MAP – Lost Place Explorer</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="map"></div>

  <header class="panel main-header">
    <div class="brand-section" onclick="openModal('Startseite')">
      <div class="logo-badge">📍</div>
      <div class="brand-title">URBEX<span>MAP</span></div>
    </div>

    <div class="header-search-box">
      <span style="opacity:0.45; font-size:12px;">🔍</span>
      <input id="search-input" type="text" placeholder="Suchen…">
    </div>

    <div class="nav-actions">
      <button class="btn-nav" onclick="openModal('Startseite')">
        <span>🏠</span><span class="text-label">Start</span>
      </button>
      <button class="btn-nav" onclick="openModal('Login')">
        <span>🔑</span><span class="text-label">Login</span>
      </button>
      <button class="btn-nav btn-nav-primary" onclick="openModal('Registrieren')">
        <span>✨</span><span class="text-label">Register</span>
      </button>
    </div>
  </header>

  <div class="panel map-style-switch">
    <button class="layer-btn active" id="layer-street" onclick="switchTileLayer('street')">
      <span>🗺️</span> Karte
    </button>
    <button class="layer-btn" id="layer-sat" onclick="switchTileLayer('satellite')">
      <span>🛰️</span> Satellit
    </button>
    <button class="layer-btn" id="layer-dark" onclick="switchTileLayer('dark')">
      <span>🌙</span> Dark
    </button>
  </div>

  <div class="panel details-panel" id="details-panel">
    <div class="details-hero">
      <button class="btn-close-panel" onclick="closeDetails()">✕</button>
      <img id="detail-img" src="" alt="Location Vorschau" />
      <div class="details-hero-overlay"></div>
    </div>

    <div class="details-content">
      <div class="tag-group">
        <span class="tag-pill cat" id="detail-cat">Industriell</span>
        <span class="tag-pill" style="color:#c94c4c; border-color:rgba(201,76,76,0.3);">⚠️ Risikozone</span>
      </div>

      <div>
        <h2 id="detail-title" style="font-size:17px; font-weight:600; color:var(--text); line-height:1.3;">-</h2>
        <p id="detail-desc" style="font-size:13px; color:var(--text-muted); line-height:1.55; margin-top:5px;">-</p>
      </div>

      <div>
        <div class="section-title">
          <span>Überwachung & Schutz</span>
          <a href="#" onclick="openSecurityModal(); return false;" style="color:var(--accent); text-decoration:none; font-size:10px;">Status melden</a>
        </div>
        <div class="security-grid" style="margin-top:7px;">
          <div class="security-item" id="sec-security">
            <span class="sec-status-dot"></span> 👮 Security
          </div>
          <div class="security-item" id="sec-alarm">
            <span class="sec-status-dot"></span> 🚨 Alarmanlage
          </div>
          <div class="security-item" id="sec-cameras">
            <span class="sec-status-dot"></span> 📹 Kameras
          </div>
          <div class="security-item" id="sec-dogs">
            <span class="sec-status-dot"></span> 🐕 Wachhunde
          </div>
        </div>
      </div>

      <div>
        <div class="section-title" style="margin-bottom:7px;">
          <span>Community Galerie</span>
        </div>
        <div class="gallery-container" id="gallery-list"></div>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <span class="label">Koordinaten</span>
          <span class="val" id="detail-coords">-</span>
        </div>
        <div class="info-item">
          <span class="label">Zugänglichkeit</span>
          <span class="val" style="color:#7bc49a;">Mittel</span>
        </div>
      </div>

      <div class="btn-group-actions">
        <button class="btn-secondary-action" onclick="openPhotoModal()">
          <span>📷</span> Foto
        </button>
        <button class="btn-primary-action" id="detail-route-btn">
          <span>🧭</span> Navigation
        </button>
      </div>
    </div>
  </div>

  <div class="filter-wrapper">
    <div class="panel category-dropdown" id="category-menu"></div>
    <button class="btn-toggle-categories" onclick="toggleCategoryMenu(event)">
      <span>📂</span>
      <span id="selected-cat-label">Alle Kategorien</span>
      <span style="font-size:9px; opacity:0.5;">▲</span>
    </button>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
    <div class="panel modal-box" id="modal-box" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="modal-title" style="color:var(--text); font-size:16px; font-weight:600;">Titel</h3>
        <button class="btn-close-panel" style="position:static;" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body">
        <p id="modal-desc" style="color:var(--text-muted); font-size:13px;">Funktion folgt.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
